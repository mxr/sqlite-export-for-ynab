# ~~ Generated by projen in mxr/base. Modifications will be overwritten on the next sync. To modify properly, edit .github/base.yml and retrigger the propagate workflow in mxr/base.

name: main

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      project_files: ${{ steps.filter.outputs.project_files }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          project_files:
            - .github/workflows/main.yml
            - '**/*.py'
            - '**/*.sql'
            - '**/*.toml'

  main-real:
    needs: [changes]
    if: needs.changes.outputs.project_files == 'true'
    uses: mxr/workflows/.github/workflows/tox-uv.yml@8f3f2b365f4602de5c39ec148f07884a0c7bbd29 # tox-uv
    with:
      env: '["py311", "py312", "py313", "py314", "py315", "pypy3"]'
      os: ubuntu-latest
  main:
    needs: [changes, main-real]
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - env:
        PROJECT_FILES: ${{ needs.changes.outputs.project_files }}
        MAIN_REAL_RESULT: ${{ needs.main-real.result }}
      run: |
        if [ "$PROJECT_FILES" != "true" ]; then
          exit 0
        fi
        if [ "$MAIN_REAL_RESULT" != "success" ]; then
          exit 1
        fi

  main-win-real:
    needs: [changes]
    if: needs.changes.outputs.project_files == 'true'
    uses: mxr/workflows/.github/workflows/tox-uv.yml@8f3f2b365f4602de5c39ec148f07884a0c7bbd29 # tox-uv
    with:
      env: '["py311"]'
      os: windows-2025
  main-win:
    needs: [changes, main-win-real]
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - env:
        PROJECT_FILES: ${{ needs.changes.outputs.project_files }}
        MAIN_WIN_REAL_RESULT: ${{ needs.main-win-real.result }}
      run: |-
        if [ "$PROJECT_FILES" != "true" ]; then
          exit 0
        fi
        if [ "$MAIN_WIN_REAL_RESULT" != "success" ]; then
          exit 1
        fi
