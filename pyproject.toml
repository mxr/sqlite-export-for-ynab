[project]
name = "sqlite_export_for_ynab"
version = "2.9.8"
description = "SQLite Export for YNAB - Export YNAB Data to SQLite"
readme = "README.md"
requires-python = ">=3.11"  # generated by mxr/base
license = "MIT"  # generated by mxr/base
license-files = ["LICENSE"]  # generated by mxr/base
authors = [{ name = "Max R", email = "mxr@users.noreply.github.com" }]  # generated by mxr/base
keywords = ["budget", "cli", "plan", "sql", "sqlite", "ynab"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "aiohttp>=3",
  "aiopathlib",
  "aiosqlite",
  "asyncio-for-ynab~=1.87.0",
  "fasteners",
  "rich>=10",
  "tenacity",
  "typing-extensions; python_version<'3.12'",
]

[project.urls]  # generated by mxr/base
Homepage = "https://github.com/mxr/sqlite-export-for-ynab"

[project.scripts]  # generated by mxr/base
sqlite-export-for-ynab = "sqlite_export_for_ynab._main:main"

[dependency-groups]
dev = [
  "covdefaults>=2.1.0",
  "coverage",
  "pytest",
  "pytest-asyncio",
]

[build-system]  # generated by mxr/base
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]  # generated by mxr/base
plugins = ["covdefaults"]

[tool.mypy]  # generated by mxr/base
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "testing.*"

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "tests.*"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]  # generated by mxr/base
extend-select = [
  "A",  # see flake8-builtins
  "B",  # see flake8-bugbear
  "C4",  # see flake8-comprehension
  "I",  # sort imports
  "SIM",  # see flake8-simplify
  "TC",  # see flake8-type-checking
  "UP",  # see pyupgrade
]

[tool.ruff.lint.isort]  # generated by mxr/base
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.setuptools.package-data]
sqlite_export_for_ynab = ["py.typed"]
"sqlite_export_for_ynab.ddl" = ["*.sql"]

[tool.setuptools.packages]  # generated by mxr/base
find = {}

[tool.sqlfluff.layout.type.comma]  # generated by mxr/base
line_position = "leading"
spacing_before = "touch"

[tool.sqlfluff.layout.type.from_clause]  # generated by mxr/base
keyword_line_position = "leading"

[tool.sqlfluff.layout.type.when_clause]  # generated by mxr/base
keyword_line_position = "leading"

[tool.sqlfluff.rules.capitalisation.functions]  # generated by mxr/base
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]  # generated by mxr/base
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.keywords]  # generated by mxr/base
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]  # generated by mxr/base
capitalisation_policy = "upper"

[tool.sqlfluff.rules.convention.not_equal]  # generated by mxr/base
preferred_not_equal_style = "c_style"

[tool.sqlfluff.rules.convention.terminator]  # generated by mxr/base
multiline_newline = true
require_final_semicolon = true

[tool.sqlfluff.rules.references.quoting]  # generated by mxr/base
prefer_quoted_keywords = true

[tool.tox]  # generated by mxr/base
env_list = ["py", "pre-commit"]

[tool.tox.env.pre-commit]  # generated by mxr/base
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit-uv"]
runner = "uv-venv-runner"
skip_install = true

[tool.tox.env_run_base]  # generated by mxr/base
commands = [
  ["coverage", "erase"],
  ["coverage", "run", "-m", "pytest", "{posargs:tests}"],
  ["coverage", "report"],
]
dependency_groups = ["dev"]
runner = "uv-venv-lock-runner"

[tool.ty.rules]  # generated by mxr/base
all = "error"
