  rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
  hooks:
  - id: mypy
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.87.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=12
    - tenacity
