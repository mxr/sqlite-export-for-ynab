default_language_version:
  python: python3.11
repos:
- repo: https://github.com/adamtheturtle/doccmd-pre-commit
  rev: 00bc9ef5e997f14a87685cf841978ff99af978c9  # frozen: v2026.9.16.1
  hooks:
