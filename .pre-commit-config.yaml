repos:
- repo: https://github.com/adamtheturtle/doccmd-pre-commit
  rev: bbdcf0ddc8ab91dd0fd2ce8cdf724f389b834b02  # frozen: v2026.8.16
  hooks:
  - id: doccmd
    name: doccmd-sqlfluff
    args: [--no-pad-file, --language, sql, --command, sqlfluff fix --dialect sqlite]
    additional_dependencies: [sqlfluff]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # frozen: v0.16.5
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-commas]
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/mxr/mirrors-ty
  rev: 429804df3fe7b725a9a36f196e9a5390c9f12cd3  # frozen: v0.0.76
  hooks:
  - id: ty
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
- repo: https://github.com/mxr/sync-typing-deps
  rev: 827c0d0f5b5dda0644170665034006604f9eb10b  # frozen: v0.6.0
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
  hooks:
  - id: mypy
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
    language_version: python3.12
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/RobertCraigie/pyright-python
  rev: 392b6ba8e54be6d603e02e9f8d601d27b7a48d12  # frozen: v1.1.411
  hooks:
  - id: pyright
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies:
    - github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 8108cc202d2aa2732b21d48507152c95ee244030  # frozen: 4.3.0
  hooks:
  - id: sqlfluff-fix
    args: [--dialect, sqlite]
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce  # frozen: v1.30.0
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
