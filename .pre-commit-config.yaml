# ~~ Generated by projen in mxr/base. Modifications will be overwritten on the next sync. To modify properly, edit .github/base.yml and retrigger the propagate workflow in mxr/base.

default_language_version:
  python: python3.11
repos:
- repo: https://github.com/adamtheturtle/doccmd-pre-commit
  rev: 00bc9ef5e997f14a87685cf841978ff99af978c9  # frozen: v2026.9.16.1
  hooks:
  - id: doccmd
    name: doccmd-sqlfluff
    args:
    - --no-pad-file
    - --language
    - sql
    - --command
    - sqlfluff fix --dialect sqlite
    additional_dependencies: [sqlfluff]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/biomejs/pre-commit
  rev: 221fa73eac76e0540995318b44e2efb2774af990  # frozen: v2.5.14
  hooks:
  - id: biome-check
- repo: https://github.com/hukkin/mdformat
  rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
  hooks:
  - id: mdformat
    args: [--number, --wrap, '120']
    additional_dependencies: [mdformat-footnote, mdformat-gfm, mdformat-gfm-alerts]
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-commas]
    exclude: ^(uv\.lock)$
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/mxr/mirrors-ty
  rev: ea8dbd382e40a986e80806b921e30a762785b580  # frozen: v0.0.84
  hooks:
  - id: ty
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
    - typing-extensions; python_version<'3.12'
- repo: https://github.com/mxr/pyright-pre-commit
  rev: 917816f768b32cc3aabd877e48b9001e7bf1b35c  # frozen: v1.1.414
  hooks:
  - id: pyright
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
    - typing-extensions; python_version<'3.12'
- repo: https://github.com/mxr/sync-typing-deps
  rev: fc38ded36eb5fcf5a9f1147d46b28d80761ac427  # frozen: v0.7.1
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
  hooks:
  - id: mypy
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
    - typing-extensions; python_version<'3.12'
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: check-merge-conflict
    args: [--assume-in-merge]
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies: [github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest]
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 8108cc202d2aa2732b21d48507152c95ee244030  # frozen: 4.3.0
  hooks:
  - id: sqlfluff-fix
    args: [--dialect, sqlite]
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
- repo: local
  hooks:
  - id: biome-schema-version
    name: biome schema version
    entry: |-
      python3 -c 'import re, pathlib; cfg = pathlib.Path(".pre-commit-config.yaml").read_text(); ver = re.search(r"biomejs/pre-commit.*?frozen: v([0-9.]+)", cfg, re.S)[1]; p = pathlib.Path("biome.json"); p.write_text(re.sub(r"schemas/[^/]+/schema\.json", f"schemas/{ver}/schema.json", p.read_text()))'
    language: python
    files: ^(biome\.json|\.pre-commit-config\.yaml)$
    pass_filenames: false
