repos:
- repo: https://github.com/adamtheturtle/doccmd-pre-commit
  rev: 00bc9ef5e997f14a87685cf841978ff99af978c9  # frozen: v2026.9.16.1
  hooks:
  - id: doccmd
    name: doccmd-sqlfluff
    args: [--no-pad-file, --language, sql, --command, sqlfluff fix --dialect sqlite]
    additional_dependencies: [sqlfluff]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/hukkin/mdformat
  rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
  hooks:
  - id: mdformat
    args: [--number, --wrap, '120']
    additional_dependencies:
    - mdformat-gfm
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-commas]
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/mxr/mirrors-ty
  rev: 247350e02d5017e6936ece7b0c05f936c6aef207  # frozen: v0.0.82
  hooks:
  - id: ty
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
- repo: https://github.com/mxr/sync-typing-deps
  rev: 896a112838d434d8e607d4d636323c5914ab933f  # frozen: v0.7.0
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
  hooks:
  - id: mypy
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
    language_version: python3.12
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/mxr/mirrors-pyright
  rev: 917816f768b32cc3aabd877e48b9001e7bf1b35c  # frozen: v1.1.414
  hooks:
  - id: pyright
    additional_dependencies:
    - aiohttp>=3
    - aiopathlib
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - fasteners
    - pytest
    - pytest-asyncio
    - rich>=10
    - tenacity
    - types-setuptools
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies:
    - github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 8108cc202d2aa2732b21d48507152c95ee244030  # frozen: 4.3.0
  hooks:
  - id: sqlfluff-fix
    args: [--dialect, sqlite]
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
